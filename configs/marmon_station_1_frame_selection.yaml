# Frame-selection config — marmon_station_1 · 132 videos · ~599,607 frames (~5.5h footage)
# Picks a diverse, non-redundant frame subset for annotation via frozen DINOv2
# embeddings + k-center greedy — no labels or trained model used (this is the first
# genuine raw-video run, unlike the two prior runs which used already-staged,
# already-labeled flat frame folders). See docs/frame_selection.md for the full design.
#
# Run:
#   python frame_extraction/select_frames.py --config configs/marmon_station_1_frame_selection.yaml

project:
  root: auto

source:
  videos_dir: "datasets/marmon_station_1/videos"
  video_ext: mkv

selection:
  keep_fraction: 0.05      # 5% of post-quality-filter candidate frames, global budget
  bucket_delta: 0.10       # cosine-distance threshold for adaptive pre-bucketing (tuning constant)
  seed_index: 0            # k-center greedy starting index into the pooled representative set

quality_filter:
  blur_thresh: 60.0              # Laplacian-variance floor — below this, dropped as blurry
  exposure_range: [15.0, 240.0]  # acceptable mean-brightness range (0-255)
  occlusion_std_thresh: 5.0      # brightness-std floor — near-uniform frame dropped as lens-occluded

embedding:
  model: facebook/dinov2-base   # frozen, no fine-tuning
  device: cuda                  # cuda | cpu
  batch_size: 32

output:
  run_dir: auto      # -> runs/frame_selection/marmon_station_1 — everything below lands under here
  cache_dir: auto    # -> <run_dir>/cache
  out: auto          # -> <run_dir>/selected.json
  stage_dir: auto    # -> <run_dir>/selected
  stage: true        # materialize the selected frames as files (written from the decoded frame, no source file to link from for video input)
