# Pipeline config — doosan_swivel · 22,889 frames · 53 classes
# Frame-selection vs even-sampling comparison, control A: the 1,144 frames picked by
# frame_extraction/select_frames.py's embedding-diversity selection (see
# docs/frame_selection.md), via runs/frame_selection/doosan_swivel/selected.json.
# Compare directly against configs/doosan_swivel_even1144.yaml (same frame COUNT,
# picked evenly instead) — isolates the selection *method* from the frame *count*,
# same pattern as runs/comparison_even1795_vs_greedy1795.md.

project:
  root: auto
  work_dir: runs/doosan_swivel_frameselect{frames}_yolo
  steps: [prepare, train, infer, evaluate]   # steps: [prepare, train, infer, evaluate, visualize]

data:
  images_dir: "datasets/doosan_swivel"
  image_ext: jpg
  classes_file: "datasets/doosan_swivel/classes.txt"
  annotation_frames: 1144             # informational only under sampling: manifest (used for work_dir naming) —
                                       # the actual training set always comes from manifest_file
  samples_per_class: 50               # unused under sampling: manifest
  eval_frames: -1                     # remaining to score (-1 = all)
  monitor_val: 200
  sampling: manifest                  # even | random | greedy | manifest
  manifest_file: "runs/frame_selection/doosan_swivel/selected.json"
  seed: 0

phase1:
  model: yolo11l                      # yolo11l | yolo11x
  imgsz: 640                          # native long side (1280x480 frames) — no downscale loss for small boxes
  epochs: 15
  batch: 4                            # dropped from 16: imgsz 640->1280 is ~4x the VRAM/step
  patience: 20
  close_mosaic: 10
  amp: true
  device: "0"

infer:
  conf: 0.4                           # lower = more recall
  iou_nms: 0.3
  max_det: 300

eval:
  iou_thresholds: [0.5, 0.75]

visualize:
  fps: 8
  limit: -1                           # -1 = all scored frames
  crf: 28                             # lower = better/larger
  show_conf: false
