# Pipeline config — doosan_swivel, frame-ORDER experiment
# Identical to doosan_swivel.yaml (sampling: even, annotation_frames: 1000, same
# hyperparameters) except `data.images_dir` points at a copy of the dataset where
# every frame was renamed to a random position (see
# standalone_scripts/shuffle_dataset.py). Sorted filenames in the original dataset
# are sequential video frame numbers, so `sampling: even`'s 1000 evenly-spaced
# picks are also evenly spread across the video's *timeline*. After shuffling,
# "evenly spaced in sorted order" no longer means anything about the original
# video — it behaves like a fixed random subset instead. Comparing this run
# against the real even-1000 run (runs/20260810_164240_doosan_swivel_1000_yolo)
# isolates whether frame order (temporal spread), not just frame count/identity,
# does real work.

project:
  root: auto
  work_dir: runs/doosan_swivel_shuffled{frames}_yolo
  steps: [prepare, train, infer, evaluate]   # steps: [prepare, train, infer, evaluate, visualize]

data:
  images_dir: "datasets/doosan_swivel_shuffled"
  image_ext: jpg
  classes_file: "datasets/doosan_swivel_shuffled/classes.txt"
  annotation_frames: 1000             # same budget as the real even-1000 run
  samples_per_class: 50               # unused under sampling: even
  eval_frames: -1                     # remaining to score (-1 = all)
  monitor_val: 200
  sampling: even                      # even | random | greedy
  seed: 0

phase1:
  model: yolo11l                      # yolo11l | yolo11x
  imgsz: 640                          # native long side (1280x480 frames) — no downscale loss for small boxes
  epochs: 15
  batch: 4                            # dropped from 16: imgsz 640->1280 is ~4x the VRAM/step
  patience: 20
  close_mosaic: 10
  amp: true
  device: "0"

infer:
  conf: 0.4                           # lower = more recall
  iou_nms: 0.3
  max_det: 300

eval:
  iou_thresholds: [0.5, 0.75]

visualize:
  fps: 8
  limit: -1                           # -1 = all scored frames
  crf: 28                             # lower = better/larger
  show_conf: false
