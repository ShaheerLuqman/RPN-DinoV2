# Pipeline config — gas_valve_2view

project:
  root: auto                          # parent of configs/
  work_dir: runs/gas_valve_{frames}_{proposer}_SAM_DINOv2

data:
  images_dir: datasets/gas_valve_2view
  image_ext: png
  classes_file: datasets/gas_valve_2view/classes.txt
  annotation_frames: 1500
  eval_frames: -1                     # remaining to score (-1 = all)
  monitor_val: 200
  sampling: even                      # even | random
  seed: 0

phase1:
  proposer: frcnn                     # yolo11l | yolo11x | sam | fastsam | yoloe | yoloe-visual | frcnn
  rtdetr: false
  multiclass: false                   # yolo11l/x only: train on ALL classes, skip Phase 2
  sam_model: weights/sam2.1_b.pt      # or weights/FastSAM-x.pt
  sam_max_area_ratio: 0.9
  sam_min_box_px: 8
  yoloe_pf_model: weights/yoloe-11l-seg-pf.pt
  yoloe_model: weights/yoloe-11l-seg.pt
  yoloe_refer_frames: 3
  frcnn_backbone: resnet101           # resnet50 | resnet50-v2 | resnet101 (bigger)
  imgsz: 1024
  epochs: 15
  batch: 16
  patience: 20
  close_mosaic: 10
  amp: true
  device: "0"

phase2:
  embed_model: facebook/dinov2-base
  knn_k: 5
  min_box_px: 8
  batch: 64
  hf_offline: true                    # DINOv2 from local cache; false to allow download
  reject_below: 0.5                   # drop proposals with nearest-ref sim < this (0 = keep all)
  mask: true                          # SAM2 box->mask, zero background before DINOv2 (writes to *_mask run)
  mask_model: weights/sam2.1_b.pt     # box-prompt segmenter for masking

infer:
  conf: 0.1                           # lower = more recall
  iou_nms: 0.7
  max_det: 300

eval:
  iou_thresholds: [0.5, 0.75]

visualize:
  fps: 8
  limit: -1                           # -1 = all scored frames
  crf: 28                             # lower = better/larger
  show_conf: false
  mask_multi: false                   # visualize-masks: false = 1 mask/box (per-class color);
                                      # true = per-box multimask (whole/part/subpart, *_masks_multi.mp4)
