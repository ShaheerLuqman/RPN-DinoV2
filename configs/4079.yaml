# Pipeline config — "4079 End Stop Verification" · 2,718 frames · 640x480 · 6 classes

project:
  root: auto
  work_dir: runs/4079_{frames}_yolo
  steps: [prepare, train, infer, evaluate]   # steps: [prepare, train, infer, evaluate, visualize]

data:
  images_dir: "datasets/4079"
  image_ext: jpg
  classes_file: "datasets/4079/classes.txt"
  annotation_frames: 300
  eval_frames: -1                     # remaining to score (-1 = all)
  monitor_val: 200
  sampling: even                      # even | random
  seed: 0

phase1:
  model: yolo11l                      # yolo11l | yolo11x
  imgsz: 640
  epochs: 15
  batch: 16
  patience: 20
  close_mosaic: 10
  amp: true
  device: "0"

infer:
  conf: 0.4                           # lower = more recall
  iou_nms: 0.3
  max_det: 300

eval:
  iou_thresholds: [0.5, 0.75]

visualize:
  fps: 8
  limit: -1                           # -1 = all scored frames
  crf: 28                             # lower = better/larger
  show_conf: false
