# Pipeline config — doosan_swivel · 22,889 frames · 55 classes
# Control for the greedy-vs-even comparison at N=100: even (old) sampling at the
# SAME frame budget (1795) that doosan_swivel_greedy100.yaml's greedy selection
# landed on — isolates the selection *method* from the frame *count*, same pattern
# as doosan_swivel_even893.yaml vs doosan_swivel_greedy50.yaml.

project:
  root: auto
  work_dir: runs/doosan_swivel_even{frames}_yolo
  steps: [prepare, train, infer, evaluate]   # steps: [prepare, train, infer, evaluate, visualize]

data:
  images_dir: "datasets/doosan_swivel"
  image_ext: jpg
  classes_file: "datasets/doosan_swivel/classes.txt"
  annotation_frames: 1795             # same count the greedy(N=100) run picked
  samples_per_class: 100              # unused under sampling: even
  eval_frames: -1                     # remaining to score (-1 = all)
  monitor_val: 200
  sampling: even                      # even | random | greedy
  seed: 0

phase1:
  model: yolo11l                      # yolo11l | yolo11x
  imgsz: 640                          # native long side (1280x480 frames) — no downscale loss for small boxes
  epochs: 15
  batch: 4                            # dropped from 16: imgsz 640->1280 is ~4x the VRAM/step
  patience: 20
  close_mosaic: 10
  amp: true
  device: "0"

infer:
  conf: 0.4                           # lower = more recall
  iou_nms: 0.3
  max_det: 300

eval:
  iou_thresholds: [0.5, 0.75]

visualize:
  fps: 8
  limit: -1                           # -1 = all scored frames
  crf: 28                             # lower = better/larger
  show_conf: false
